<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded pill -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Stacked Isometric Cube Group -->
  <g filter="url(#glow)">
    <!-- Top Cube -->
    <!-- Top Face -->
    <polygon points="32,10 46,18 32,26 18,18" fill="url(#gradTop)" />
    <!-- Left Face -->
    <polygon points="18,18 32,26 32,38 18,30" fill="url(#gradLeft)" />
    <!-- Right Face -->
    <polygon points="32,26 46,18 46,30 32,38" fill="url(#gradRight)" />

    <!-- Bottom Left Accent Segment -->
    <polygon points="18,34 28,40 28,48 18,42" fill="#38bdf8" opacity="0.9" />
    <!-- Bottom Right Accent Segment -->
    <polygon points="46,34 36,40 36,48 46,42" fill="#a855f7" opacity="0.9" />
  </g>
</svg>
